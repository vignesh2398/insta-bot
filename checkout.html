<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Razorpay Checkout Demo</title>
    <style>
      body { font-family: Arial, sans-serif; margin: 2rem; line-height: 1.5; }
      button { padding: 0.8rem 1.2rem; border: 0; border-radius: 6px; background: #ff4d6d; color: #fff; cursor: pointer; }
      button:hover { background: #e43d61; }
      #message { margin-top: 1rem; font-weight: 600; }
    </style>
  </head>
  <body>
    <h1>Razorpay Standard Checkout</h1>
    <p>Click the button below to open the Razorpay payment modal.</p>
    <button id="payBtn">Pay ₹100</button>
    <div id="message"></div>

    <script src="https://checkout.razorpay.com/v1/checkout.js"></script>
    <script>
      const payBtn = document.getElementById('payBtn');
      const message = document.getElementById('message');

      payBtn.addEventListener('click', async () => {
        message.textContent = 'Creating order...';
        try {
          const response = await fetch('/api/create-order', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ amount: 100, currency: 'INR', receipt: 'demo-receipt' })
          });

          const data = await response.json();
          if (!response.ok) {
            throw new Error(data.error || 'Unable to create order');
          }

          const options = {
            key: data.key,
            amount: data.amount,
            currency: data.currency,
            order_id: data.order_id,
            name: 'Insta Bot',
            description: 'Demo purchase',
            handler: async function (response) {
              message.textContent = 'Verifying payment...';
              try {
                const verifyResponse = await fetch('/api/verify-payment', {
                  method: 'POST',
                  headers: { 'Content-Type': 'application/json' },
                  body: JSON.stringify({
                    razorpay_order_id: response.razorpay_order_id,
                    razorpay_payment_id: response.razorpay_payment_id,
                    razorpay_signature: response.razorpay_signature,
                  })
                });

                const verifyData = await verifyResponse.json();
                if (!verifyResponse.ok || !verifyData.success) {
                  throw new Error(verifyData.error || 'Payment verification failed');
                }

                message.textContent = 'Payment verified successfully!';
              } catch (error) {
                message.textContent = error.message;
              }
            },
            modal: {
              ondismiss: function () {
                message.textContent = 'Payment modal closed.';
              }
            },
            prefill: {
              name: 'Demo User',
              email: 'demo@example.com',
              contact: '9999999999'
            },
            theme: { color: '#ff4d6d' }
          };

          const razorpayCheckout = new Razorpay(options);
          razorpayCheckout.open();
        } catch (error) {
          message.textContent = error.message;
        }
      });
    </script>
  </body>
</html>
